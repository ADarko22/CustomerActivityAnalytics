services:
  postgres:
    image: postgres:16-alpine
    container_name: caa-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-customer_activity_analytics}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - caa-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  wiremock:
    # Not the "-alpine" variant: it's amd64-only on Docker Hub and fails to pull on arm64 hosts
    # (e.g. Apple Silicon) with "no matching manifest for linux/arm64/v8".
    image: wiremock/wiremock:3.9.1
    container_name: caa-wiremock
    ports:
      - "${WIREMOCK_PORT:-8089}:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
    # Default: serve the canned stubs in ./wiremock/mappings, for the offline demo (docs/DECISIONS.md D4).
    # Dev record mode (WIREMOCK_RECORD_MODE=true + a real API key on the backend for whichever provider
    # WIREMOCK_PROXY_TARGET points at): proxies to the real provider API and records the exchange as a new
    # stub — see local-environment/wiremock/README.md for the OpenAI and Anthropic record-mode steps.
    command: >
      --global-response-templating
      ${WIREMOCK_RECORD_MODE:+--record-mappings --proxy-all=${WIREMOCK_PROXY_TARGET:-https://api.openai.com}}

  keycloak:
    # Operator/OIDC login (docs/DECISIONS.md D2) — the realm, client, demo users, and roles are
    # provisioned declaratively from ./keycloak/realm-export.json on every startup (--import-realm),
    # so a fresh clone gets a working IdP with no manual admin-console setup. See
    # local-environment/keycloak/README.md for the demo logins and how to re-export the realm.
    image: quay.io/keycloak/keycloak:26.0
    container_name: caa-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  caa-postgres-data:
