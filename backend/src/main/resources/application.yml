spring:
  application:
    name: customer-activity-analytics
  ai:
    openai:
      # Placeholder so the context loads without a real key before a real provider is configured.
      api-key: ${OPENAI_API_KEY:placeholder-api-key}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
      # base-url intentionally unset here (Spring AI defaults to the real OpenAI API) — the
      # local profile (application-local.yml) points it at the WireMock stub instead.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:placeholder-api-key}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
      # base-url intentionally unset (Spring AI defaults to the real Anthropic API) — the local
      # profile points it at WireMock's Anthropic-shaped stub instead, mirroring OpenAI's setup.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customer_activity_analytics}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Lazy JWKS fetch (only on first real token decode) — unlike issuer-uri, this never blocks
          # application-context startup on a live Keycloak instance (docs/development/PHASE_5_PLAN.md
          # Clarification #1), so `./gradlew check` stays green without Keycloak running.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/customer-activity-analytics/protocol/openid-connect/certs}

app:
  analytics:
    range-constraints:
      bounds:
        DAY: { min-amount: 1, min-unit: DAYS, max-amount: 3, max-unit: MONTHS }
        WEEK: { min-amount: 1, min-unit: WEEKS, max-amount: 1, max-unit: YEARS }
        MONTH: { min-amount: 1, min-unit: MONTHS, max-amount: 5, max-unit: YEARS }
        YEAR: { min-amount: 1, min-unit: YEARS, max-amount: 20, max-unit: YEARS }
  ai:
    provider: ${AI_PROVIDER:openai}
    record-mode: ${AI_RECORD_MODE:false}
  risk:
    max-triggered-rules: 5
    assessment-timeout: 45s
    sse-timeout: 50s
    level-thresholds:
      low-max: 30
      medium-max: 70
    history-context-size: 5
    guardrail:
      patterns:
        - name: CARD_PAN
          regex: '\b(?:\d[ -]?){13,19}\b'
        - name: IBAN
          regex: '\b[A-Z]{2}\d{2}[A-Z0-9]{10,30}\b'
        - name: EMAIL
          regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
        - name: CRYPTO_WALLET
          regex: '\b0x[a-fA-F0-9]{40}\b|\b(bc1|[13])[a-zA-HJ-NP-Z0-9]{25,39}\b'

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
