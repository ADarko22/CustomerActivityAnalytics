spring:
  application:
    name: customer-activity-analytics
  ai:
    openai:
      # Placeholder so the context loads without a real key before Phase 4 wires up AI usage.
      api-key: ${OPENAI_API_KEY:placeholder-api-key}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customer_activity_analytics}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true

app:
  analytics:
    range-constraints:
      bounds:
        DAY: { min-amount: 1, min-unit: DAYS, max-amount: 3, max-unit: MONTHS }
        WEEK: { min-amount: 1, min-unit: WEEKS, max-amount: 1, max-unit: YEARS }
        MONTH: { min-amount: 1, min-unit: MONTHS, max-amount: 5, max-unit: YEARS }
        YEAR: { min-amount: 1, min-unit: YEARS, max-amount: 20, max-unit: YEARS }

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
