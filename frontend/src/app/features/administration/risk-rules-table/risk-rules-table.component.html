<div class="table-toolbar">
  <mat-form-field appearance="outline" class="scope-filter">
    <mat-label>Applies to</mat-label>
    <mat-select [value]="appliesToFilter()" (selectionChange)="onFilterChange($event.value)">
      <mat-option [value]="undefined">All</mat-option>
      @for (option of scopeOptions; track option) {
        <mat-option [value]="option">{{ option }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>

<table mat-table [dataSource]="rules()" class="risk-rules-table">
  <ng-container matColumnDef="ruleName">
    <th mat-header-cell *matHeaderCellDef>Rule Name</th>
    <td mat-cell *matCellDef="let rule">{{ rule.ruleName }}</td>
  </ng-container>

  <ng-container matColumnDef="appliesTo">
    <th mat-header-cell *matHeaderCellDef>Applies To</th>
    <td mat-cell *matCellDef="let rule">
      <mat-chip>{{ rule.appliesTo }}</mat-chip>
    </td>
  </ng-container>

  <ng-container matColumnDef="thresholdLogic">
    <th mat-header-cell *matHeaderCellDef>Threshold Logic</th>
    <td mat-cell *matCellDef="let rule">
      <span class="truncated" [matTooltip]="rule.thresholdLogic">{{ rule.thresholdLogic }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="weight">
    <th mat-header-cell *matHeaderCellDef>Weight</th>
    <td mat-cell *matCellDef="let rule">{{ rule.weight }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let rule">
      @if (isAdmin()) {
        <button
          type="button"
          mat-icon-button
          [attr.aria-label]="'Edit ' + rule.ruleName"
          (click)="edit.emit(rule)"
        >
          <fa-icon [icon]="faPen" size="xs" />
        </button>
        <button
          type="button"
          mat-icon-button
          [attr.aria-label]="'Delete ' + rule.ruleName"
          (click)="deleteRequested.emit(rule)"
        >
          <fa-icon [icon]="faTrash" size="xs" />
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator
  [length]="totalElements()"
  [pageSize]="pageSize()"
  [pageIndex]="pageIndex()"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
/>
