<h2 mat-dialog-title>{{ isEdit ? 'Edit Risk Rule' : 'Add Risk Rule' }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Rule Name</mat-label>
      <input matInput formControlName="ruleName" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Applies To</mat-label>
      <mat-select formControlName="appliesTo" required>
        @for (option of scopeOptions; track option) {
          <mat-option [value]="option">{{ option }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Threshold Logic</mat-label>
      <textarea matInput formControlName="thresholdLogic" rows="3" required></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Weight</mat-label>
      <input matInput type="number" formControlName="weight" min="0" required />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="cancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary">Save</button>
  </mat-dialog-actions>
</form>
